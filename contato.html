<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Gabriel Vinicius de Morais</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="site-header">
        <h1>Bem-vindo ao portfólio de Gabriel Vinicius de Morais</h1>

        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="sobre.html">Sobre Mim</a></li>
                <li><a href="formacao.html">Formação</a></li>
                <li><a href="portfolio.html">Portfólio</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav> 
    </header>
    
    <main>
        <h2>Contato</h2>
        <p>Você pode me contatar pelos seguintes meios:</p>
        <ul>
            <li><strong>Telefone:</strong> 31 995227046</li>
            <li><strong>E-mail:</strong> <a href="mailto:gabriel66585@gmail.com">gabriel66585@gmail.com</a></li>
        </ul>

        <hr style="margin: 20px 0;">

        <h3>Mural de Comentários:</h3>
        <textarea id="campo-comentario" rows="4" style="width: 100%;" placeholder="Deixe sua mensagem..."></textarea><br><br>
        <button onclick="postarComentario()">Enviar Mensagem</button>

        <div id="area-comentarios" style="margin-top: 20px;"></div>
    </main>

    <footer>
        <p>2024 Gabriel Vinícius</p>
    </footer>

    <script>
      const BIN_ID = '6a7dd4c3da38895dfedff2e4';
      const API_KEY = '$2a$10$Ccomw16Fu3kdGbtDq6pJBesj8JE76jSOlKRHASrY.sWFjmQO/lb7i';
      const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

      let listaComentarios = [];

      // Aplica tema salvo no localStorage em todas as páginas
      function aplicarTemaSalvo() {
        const bg = localStorage.getItem('header_bg');
        const color = localStorage.getItem('header_color');
        const header = document.getElementById('site-header');
        if (header && bg) {
          header.style.backgroundColor = bg;
          if (color) header.style.color = color;
        }
      }

      async function carregarComentarios() {
        aplicarTemaSalvo();
        try {
          const res = await fetch(`${API_URL}/latest`, {
            headers: { 'X-Master-Key': API_KEY }
          });
          const data = await res.json();
          listaComentarios = data.record.comentarios || [];

          const container = document.getElementById('area-comentarios');
          container.innerHTML = '';

          listaComentarios.forEach(comentario => {
            const div = document.createElement('div');
            div.style.borderBottom = '1px solid #ccc';
            div.style.padding = '10px 0';
            div.innerHTML = comentario; 
            container.appendChild(div);
          });
        } catch (err) {
          console.error("Erro ao carregar comentários:", err);
        }
      }

      async function postarComentario() {
        const texto = document.getElementById('campo-comentario').value;
        if (!texto) return;

        listaComentarios.push(texto);

        try {
          await fetch(API_URL, {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              'X-Master-Key': API_KEY
            },
            body: JSON.stringify({ comentarios: listaComentarios })
          });

          document.getElementById('campo-comentario').value = '';
          carregarComentarios();
        } catch (err) {
          console.error("Erro ao salvar comentário:", err);
        }
      }

      window.onload = carregarComentarios;
    </script>
</body>
</html>
